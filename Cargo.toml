[package]
name = "axum-ipware"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Client IP extraction and IP allow/block filtering middleware for axum, powered by ipware"
repository = "https://github.com/orhanbalci/axum-ipware"
homepage = "https://github.com/orhanbalci"
keywords = ["axum", "ip", "filter", "middleware", "proxy"]
categories = ["web-programming::http-server", "network-programming"]
license = "MIT"
readme = "README.md"
exclude = [".github", "rustfmt.toml"]

[features]
# ipware's platform presets and provider IP ranges
providers = ["ipware/providers"]
# CrowdSec bouncer: block the IPs the CrowdSec Local API bans
crowdsec = ["fetch", "dep:serde_json"]
# Country and ASN rules from MaxMind databases
geo = ["dep:maxminddb"]
# Glob patterns such as `192.168.1.*` for allow/block lists and rules
glob = []
# Temporary bans after too many error responses, like fail2ban
autoban = ["dep:pin-project-lite"]
# Rate limit key for tower_governor based on the resolved client IP
governor = ["dep:tower_governor"]
# Keep lists up to date from files or custom loaders
refresh = ["dep:tokio"]
# HTTPS source for `refresh`, built on reqwest with rustls
fetch = ["refresh", "dep:reqwest"]

[dependencies]
arc-swap = "1"
axum = { version = "0.8", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
ipware = "0.5.1"
maxminddb = { version = "0.32", optional = true }
pin-project-lite = { version = "0.2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["fs", "rt", "time"], optional = true }
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tracing"], optional = true }
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "refresh"
required-features = ["fetch"]

[[example]]
name = "rate_limit"
required-features = ["governor", "autoban"]

[[example]]
name = "geo"
required-features = ["geo"]

[[example]]
name = "crowdsec"
required-features = ["crowdsec"]
