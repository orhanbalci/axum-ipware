[package]
name = "axum-ipware"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Client IP extraction and IP allow/block filtering middleware for axum, powered by ipware"
repository = "https://github.com/orhanbalci/axum-ipware"
homepage = "https://github.com/orhanbalci"
keywords = ["axum", "ip", "filter", "middleware", "proxy"]
categories = ["web-programming::http-server", "network-programming"]
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
ipware = { version = "0.4", git = "https://github.com/orhanbalci/ipware.git", rev = "b37955d02ac07f18736bad1f30c67d1c8c6db8f7" }
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
